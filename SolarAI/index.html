<!DOCTYPE html>
<html lang="en" data-i18n-page-title="page_title_solar_ai">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="/SolarOS/favicon.ico">
  <title>SolarAI • SolarOS</title>
  <link rel="icon" href="/SolarOS/favicon.ico" />
  <style>
    :root{
      --bg0:#05070d;
      --bg1:#081226;
      --txt:#eef3ff;
      --muted:rgba(238,243,255,.74);
      --muted2:rgba(238,243,255,.55);
      --stroke:rgba(255,255,255,.14);
      --r:22px;
      --shadow: 0 22px 70px rgba(0,0,0,.52);
      --shadow2: 0 10px 35px rgba(0,0,0,.32);
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--txt);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
      background:
        radial-gradient(900px 650px at 18% -10%, rgba(77,163,255,.22), transparent 60%),
        radial-gradient(850px 600px at 92% 0%, rgba(255,214,90,.18), transparent 60%),
        radial-gradient(780px 560px at 60% 110%, rgba(160,110,255,.10), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:-2px;
      z-index:-2;
      background: url("/SolarOS/Background.png") center/cover no-repeat;
      filter:saturate(1.05) contrast(1.02);
      opacity:.22;
      transform:scale(1.02);
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;
      background:
        radial-gradient(680px 420px at 18% 18%, rgba(255,255,255,.08), transparent 62%),
        radial-gradient(560px 380px at 78% 26%, rgba(255,255,255,.06), transparent 62%),
        radial-gradient(900px 560px at 50% 86%, rgba(255,255,255,.05), transparent 62%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.010), rgba(255,255,255,.010) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: screen;
      opacity:.85;
    }
    a{ color:inherit; text-decoration:none; }
    a:focus-visible, button:focus-visible, textarea:focus-visible{
      outline:2px solid rgba(77,163,255,.75);
      outline-offset:3px;
      border-radius:14px;
    }
    .wrap{ max-width: 1080px; margin:0 auto; padding:22px; }
    .nav{
      position: sticky; top:14px; z-index:50;
      border-radius:999px; border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow2); overflow:hidden;
    }
    .navInner{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 14px; }
    .brand{ display:flex; align-items:center; gap:12px; min-width:200px; }
    .brandLogo{ height:35px; width:auto; max-width:220px; border-radius:14px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.10); box-shadow:0 10px 26px rgba(0,0,0,.30); padding:4px; }
    .links{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .link{ padding:10px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.10); background:rgba(0,0,0,.10); color:var(--muted); font-weight:850; font-size:12px; transition:.12s ease; }
    .link:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.06); color:var(--txt); }
    .link.active{ color:var(--txt); border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.08); }
    .cta{ padding:10px 14px; border-radius:999px; font-weight:950; font-size:12px; color:#0a1220; border:1px solid rgba(0,0,0,.25); background:linear-gradient(180deg, rgba(255,214,90,.98), rgba(255,174,38,.92)); box-shadow:0 18px 35px rgba(255,214,90,.18); }
    .hero{ margin-top:16px; border-radius:var(--r); border:1px solid var(--stroke); background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05)); box-shadow:var(--shadow); padding:18px; }
    h1{ margin:0 0 8px; font-size:34px; line-height:1.1; }
    .lead{ margin:0; color:var(--muted); font-size:14px; line-height:1.55; max-width:70ch; }
    .metaRow{ margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; }
    .status{ padding:10px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.12); color:var(--muted); font-weight:900; font-size:12px; display:inline-flex; gap:8px; align-items:center; }
    .statusDot{ width:8px; height:8px; border-radius:999px; background:rgba(255,255,255,.35); box-shadow:0 0 0 4px rgba(255,255,255,.08); }
    .status.online .statusDot{ background:rgba(110,255,196,1); box-shadow:0 0 0 4px rgba(110,255,196,.12); }
    .status.offline .statusDot{ background:rgba(255,120,120,1); box-shadow:0 0 0 4px rgba(255,120,120,.12); }
    .tag{ padding:10px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.12); color:var(--muted); font-weight:850; font-size:12px; }
    .panel{ margin-top:14px; border-radius:var(--r); border:1px solid var(--stroke); background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.05)); box-shadow:var(--shadow); padding:16px; }
    .chatWrap{ border-radius:18px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.14); overflow:hidden; }
    .chatTop,.chatBottom{ display:flex; justify-content:space-between; gap:10px; padding:12px; border-bottom:1px solid rgba(255,255,255,.10); }
    .chatBottom{ border-bottom:0; border-top:1px solid rgba(255,255,255,.10); align-items:flex-end; }
    .chatArea{ height:400px; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
    .bubble{ max-width:min(760px,92%); border-radius:16px; padding:10px 12px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); color:rgba(238,243,255,.90); font-size:13px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; }
    .bubble.user{ align-self:flex-end; background:linear-gradient(180deg, rgba(77,163,255,.22), rgba(77,163,255,.10)); border-color:rgba(77,163,255,.22); }
    .bubble.ai{ align-self:flex-start; background:rgba(0,0,0,.18); color:rgba(238,243,255,.82); }
    textarea{ flex:1; min-height:56px; max-height:180px; resize:vertical; padding:12px; border-radius:16px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.18); color:var(--txt); font-size:13px; }
    .ghostBtn,.sendBtn{ border-radius:14px; padding:10px 12px; font-size:12px; font-weight:900; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:var(--txt); cursor:pointer; }
    .sendBtn{ border-color:rgba(0,0,0,.25); background:linear-gradient(180deg, rgba(255,214,90,.98), rgba(255,174,38,.92)); color:#0a1220; padding:12px 14px; }
    .sendBtn:disabled{ opacity:.6; cursor:not-allowed; }
    .footer{ margin:18px 0 6px; text-align:center; color:var(--muted2); font-size:12px; }
    .sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:980px){ .navInner{ padding:10px 12px; } .brand{ min-width:unset; } .brandLogo{ max-width:160px; } }
    @media (max-width:520px){ h1{ font-size:28px; } .brandLogo{ height:28px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <div class="navInner">
        <a class="brand" href="/SolarOS/" data-i18n-title="nav_home_title"><img class="brandLogo" src="/SolarOS/SolarLogoWithName.png" alt="SolarOS" /></a>
        <nav class="links" aria-label="Primary">
          <a class="link" href="/SolarOS/" data-i18n="nav_home"></a>
          <a class="link" href="/SolarOS/about/" data-i18n="nav_about"></a>
          <a class="link" href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noreferrer" data-i18n="nav_license"></a>
          <a class="link" href="https://discord.gg/3RBkhPtf" target="_blank" rel="noreferrer" data-i18n="nav_community"></a>
          <a class="link" href="https://github.com/Davi-Luiz/SolarOS" target="_blank" rel="noreferrer" data-i18n="nav_source"></a>
          <a class="cta" href="/SolarOS/download/" data-i18n="nav_downloads"></a>
        </nav>
      </div>
    </header>

    <section class="hero">
      <h1 data-i18n="ai_hero_title"></h1>
      <p class="lead" data-i18n="ai_hero_lead"></p>
      <div class="metaRow">
        <span id="apiStatus" class="status offline"><span class="statusDot"></span><span id="apiStatusText">...</span></span>
        <span class="tag" data-i18n="ai_privacy_note"></span>
      </div>
    </section>

    <main class="panel" id="chat">
      <h2 data-i18n="ai_section_title"></h2>
      <p class="lead" data-i18n="ai_section_body"></p>
      <div class="chatWrap">
        <div class="chatTop">
          <strong data-i18n="ai_chat_label"></strong>
          <div>
            <button class="ghostBtn" id="newChatBtn" type="button" data-i18n="ai_new_chat"></button>
            <button class="ghostBtn" id="clearBtn" type="button" data-i18n="ai_clear"></button>
          </div>
        </div>
        <div class="chatArea" id="chatArea" data-i18n-aria="ai_chat_area_aria"></div>
        <div class="chatBottom">
          <textarea id="prompt" spellcheck="false" data-i18n-aria="ai_prompt_aria"></textarea>
          <button class="sendBtn" id="sendBtn" type="button" data-i18n="ai_send"></button>
        </div>
      </div>

      <span class="sr" id="t_checking" data-i18n="ai_status_checking"></span>
      <span class="sr" id="t_online" data-i18n="ai_status_online"></span>
      <span class="sr" id="t_offline" data-i18n="ai_status_offline"></span>
      <span class="sr" id="t_offline_msg" data-i18n="ai_offline_message"></span>
      <span class="sr" id="t_error_msg" data-i18n="ai_error_message"></span>
      <span class="sr" id="t_placeholder" data-i18n="ai_placeholder"></span>
      <span class="sr" id="t_stream_interrupted" data-i18n="ai_stream_interrupted"></span>
      <span class="sr" id="t_no_response" data-i18n="ai_no_response"></span>
    </main>

    <div class="footer" data-i18n="footer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="/SolarOS/js/i18n.js"></script>
  <script src="/SolarOS/js/solarai.js"></script>
</body>
</html>
