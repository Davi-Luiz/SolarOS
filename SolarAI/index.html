<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SolarAI • SolarOS</title>
  <link rel="icon" href="/SolarOS/favicon.ico" />

  <style>
    :root{
      --bg0:#05070d;
      --bg1:#081226;

      --txt:#eef3ff;
      --muted:rgba(238,243,255,.74);
      --muted2:rgba(238,243,255,.55);

      --stroke:rgba(255,255,255,.14);

      --r:22px;
      --shadow: 0 22px 70px rgba(0,0,0,.52);
      --shadow2: 0 10px 35px rgba(0,0,0,.32);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--txt);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
      background:
        radial-gradient(900px 650px at 18% -10%, rgba(77,163,255,.22), transparent 60%),
        radial-gradient(850px 600px at 92% 0%, rgba(255,214,90,.18), transparent 60%),
        radial-gradient(780px 560px at 60% 110%, rgba(160,110,255,.10), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:-2px;
      z-index:-2;
      background: url("/SolarOS/Background.png") center/cover no-repeat;
      filter:saturate(1.05) contrast(1.02);
      opacity:.22;
      transform:scale(1.02);
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;
      background:
        radial-gradient(680px 420px at 18% 18%, rgba(255,255,255,.08), transparent 62%),
        radial-gradient(560px 380px at 78% 26%, rgba(255,255,255,.06), transparent 62%),
        radial-gradient(900px 560px at 50% 86%, rgba(255,255,255,.05), transparent 62%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.010), rgba(255,255,255,.010) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: screen;
      opacity:.85;
    }

    a{ color:inherit; text-decoration:none; }
    a:focus-visible, button:focus-visible, textarea:focus-visible{
      outline: 2px solid rgba(77,163,255,.75);
      outline-offset: 3px;
      border-radius: 14px;
    }

    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 22px;
    }

    /* NAVBAR */
    .nav{
      position: sticky;
      top: 14px;
      z-index: 50;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow2);
      overflow:hidden;
    }
    .navInner{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding: 10px 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 200px;
    }
    .brandLogo{
      height: 35px;
      width: auto;
      max-width: 220px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.10);
      box-shadow: 0 10px 26px rgba(0,0,0,.30);
      display:block;
      object-fit: contain;
      padding: 4px;
    }

    .links{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .link{
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.10);
      color: rgba(238,243,255,.74);
      font-weight: 850;
      font-size: 12px;
      letter-spacing: .2px;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
      display:inline-flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
    }
    .link:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.22);
      background: rgba(255,255,255,.06);
      color: var(--txt);
    }
    .link.active{
      color: var(--txt);
      border-color: rgba(255,255,255,.22);
      background: rgba(255,255,255,.08);
    }

    .cta{
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 950;
      letter-spacing: .2px;
      font-size: 12px;
      color:#0a1220;
      border: 1px solid rgba(0,0,0,.25);
      background: linear-gradient(180deg, rgba(255,214,90,.98), rgba(255,174,38,.92));
      box-shadow: 0 18px 35px rgba(255,214,90,.18);
      transition: transform .12s ease, filter .12s ease;
      white-space:nowrap;
    }
    .cta:hover{ transform: translateY(-1px); filter: brightness(1.02); }

    /* status pill */
    .status{
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.12);
      color: rgba(238,243,255,.74);
      font-weight: 900;
      font-size: 12px;
      letter-spacing: .2px;
      display:inline-flex;
      gap:8px;
      align-items:center;
      white-space:nowrap;
    }
    .statusDot{
      width:8px;height:8px;border-radius:999px;
      background: rgba(255,255,255,.35);
      box-shadow: 0 0 0 4px rgba(255,255,255,.08);
    }
    .status.online .statusDot{
      background: rgba(110,255,196,1);
      box-shadow: 0 0 0 4px rgba(110,255,196,.12);
    }
    .status.offline .statusDot{
      background: rgba(255,120,120,1);
      box-shadow: 0 0 0 4px rgba(255,120,120,.12);
    }

    /* CHAT CARD */
    .panel{
      margin-top: 16px;
      border-radius: var(--r);
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.05));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
      padding: 16px;
    }

    .panel h2{
      margin:0 0 8px;
      font-size: 16px;
      letter-spacing:.2px;
    }
    .panel p{
      margin:0 0 12px;
      color: rgba(238,243,255,.74);
      font-size: 13px;
      line-height:1.55;
    }

    .anchor{ scroll-margin-top: 92px; }

    .chatWrap{
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.14);
      overflow:hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    .chatTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .chatControls{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap: wrap;
      justify-content:flex-end;
    }
    .ghostBtn{
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--txt);
      padding: 10px 12px;
      border-radius: 14px;
      cursor:pointer;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: .2px;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
      white-space:nowrap;
    }
    .ghostBtn:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.24);
      background: rgba(255,255,255,.08);
    }

    .chatArea{
      height: 420px;
      overflow:auto;
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .bubble{
      max-width: min(780px, 92%);
      border-radius: 16px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: rgba(238,243,255,.90);
      line-height: 1.55;
      font-size: 13px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .bubble.user{
      align-self:flex-end;
      background: linear-gradient(180deg, rgba(77,163,255,.22), rgba(77,163,255,.10));
      border-color: rgba(77,163,255,.22);
    }
    .bubble.ai{
      align-self:flex-start;
      background: rgba(0,0,0,.18);
      border-color: rgba(255,255,255,.12);
      color: rgba(238,243,255,.82);
    }

    .chatBottom{
      display:flex;
      gap: 10px;
      align-items:flex-end;
      padding: 12px;
      border-top: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    textarea{
      flex: 1;
      min-height: 54px;
      max-height: 180px;
      resize: vertical;
      padding: 12px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      color: var(--txt);
      font-size: 13px;
      line-height: 1.45;
      outline: none;
    }
    .sendBtn{
      border: 1px solid rgba(0,0,0,.25);
      background: linear-gradient(180deg, rgba(255,214,90,.98), rgba(255,174,38,.92));
      color:#0a1220;
      padding: 12px 14px;
      border-radius: 16px;
      cursor:pointer;
      font-weight: 950;
      letter-spacing: .2px;
      font-size: 13px;
      box-shadow: 0 18px 35px rgba(255,214,90,.16);
      transition: transform .12s ease, filter .12s ease;
      white-space:nowrap;
    }
    .sendBtn:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .sendBtn:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
      filter:none;
    }

    .sr{
      position:absolute;
      width:1px;height:1px;
      padding:0;margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    .footer{
      margin: 18px 0 6px;
      text-align:center;
      color: rgba(238,243,255,.55);
      font-size: 12px;
    }

    @media (max-width: 980px){
      .navInner{ padding: 10px 12px; }
      .brand{ min-width: unset; }
      .brandLogo{ max-width: 160px; }
      .chatArea{ height: 380px; }
    }
    @media (max-width: 520px){
      .brandLogo{ height: 28px; border-radius: 13px; padding: 4px; }
      .link{ padding: 9px 10px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header class="nav">
      <div class="navInner">
        <a class="brand" href="/SolarOS/" data-i18n-title="nav_home_title">
          <img class="brandLogo" src="/SolarOS/SolarLogoWithName.png" alt="SolarOS" />
        </a>

        <nav class="links" aria-label="Primary">
          <a class="link" href="/SolarOS/" data-i18n="nav_home"></a>
          <a class="link" href="/SolarOS/about/" data-i18n="nav_about"></a>
          <a class="link" href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noreferrer" data-i18n="nav_license"></a>
          <a class="link" href="https://discord.gg/3RBkhPtf" target="_blank" rel="noreferrer" data-i18n="nav_community"></a>
          <a class="link" href="https://github.com/Davi-Luiz/SolarOS" target="_blank" rel="noreferrer" data-i18n="nav_source"></a>

          <span id="apiStatus" class="status offline" title="SolarAI">
            <span class="statusDot"></span>
            <span id="apiStatusText">...</span>
          </span>

          <a class="cta" href="#chat" data-i18n="nav_chat"></a>
        </nav>
      </div>
    </header>

    <main class="panel anchor" id="chat">
      <h2 data-i18n="ai_section_title"></h2>
      <p data-i18n="ai_section_body"></p>

      <div class="chatWrap">
        <div class="chatTop">
          <div style="font-weight:950;font-size:12px;letter-spacing:.2px;color:var(--txt);">
            <span data-i18n="ai_chat_label"></span>
          </div>

          <div class="chatControls">
            <button class="ghostBtn" id="newChatBtn" type="button">New chat</button>
            <button class="ghostBtn" id="clearBtn" type="button">
              <span data-i18n="ai_clear"></span>
            </button>
          </div>
        </div>

        <div class="chatArea" id="chatArea" aria-label="Chat"></div>

        <div class="chatBottom">
          <textarea id="prompt" spellcheck="false"></textarea>
          <button class="sendBtn" id="sendBtn" type="button">
            <span data-i18n="ai_send"></span>
          </button>
        </div>
      </div>

      <span class="sr" id="t_checking" data-i18n="ai_status_checking"></span>
      <span class="sr" id="t_online" data-i18n="ai_status_online"></span>
      <span class="sr" id="t_offline" data-i18n="ai_status_offline"></span>
      <span class="sr" id="t_offline_msg" data-i18n="ai_offline_message"></span>
      <span class="sr" id="t_error_msg" data-i18n="ai_error_message"></span>
      <span class="sr" id="t_placeholder" data-i18n="ai_placeholder"></span>
    </main>

    <div class="footer" data-i18n="footer"></div>
  </div>

  <script src="/SolarOS/js/i18n.js"></script>

  <script>
    const API_BASE = "https://api-solarai.duckdns.org";

    const apiStatus = document.getElementById("apiStatus");
    const apiStatusText = document.getElementById("apiStatusText");

    const chatArea = document.getElementById("chatArea");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const newChatBtn = document.getElementById("newChatBtn");

    const T = {
      checking: document.getElementById("t_checking"),
      online: document.getElementById("t_online"),
      offline: document.getElementById("t_offline"),
      offlineMsg: document.getElementById("t_offline_msg"),
      errorMsg: document.getElementById("t_error_msg"),
      placeholder: document.getElementById("t_placeholder"),
    };

    const SESSION_KEY = "solarai_session_id";
    let sessionId = localStorage.getItem(SESSION_KEY);
    if (!sessionId) {
      sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
      localStorage.setItem(SESSION_KEY, sessionId);
    }

    let isStreaming = false;

    function setStatus(state){
      apiStatus.classList.remove("online","offline");
      if(state === "online"){
        apiStatus.classList.add("online");
        apiStatusText.textContent = T.online.textContent || "Online";
      }else if(state === "offline"){
        apiStatus.classList.add("offline");
        apiStatusText.textContent = T.offline.textContent || "Offline";
      }else{
        apiStatus.classList.add("offline");
        apiStatusText.textContent = T.checking.textContent || "Checking...";
      }
    }

    function addBubble(text, who){
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.textContent = text;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
      return div;
    }

    function detectLanguage(){
      const docLang = (document.documentElement.lang || "").toLowerCase();
      if (docLang.startsWith("pt")) return "pt";
      if (docLang.startsWith("en")) return "en";

      const nav = (navigator.language || "en").toLowerCase();
      return nav.startsWith("pt") ? "pt" : "en";
    }

    function nowString(){
      try{
        return new Date().toLocaleString();
      }catch(_){
        return "unavailable";
      }
    }

    async function checkHealth(){
      setStatus("checking");

      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), 2000);

      try{
        const res = await fetch(API_BASE + "/health", { signal: controller.signal });
        clearTimeout(t);

        if(res.ok){
          try{
            const j = await res.json();
            if(j && j.status === "ok"){
              setStatus("online");
              return true;
            }
          }catch(_){}
          setStatus("online");
          return true;
        }
      }catch(e){
        clearTimeout(t);
      }

      setStatus("offline");
      return false;
    }

    async function send(){
      if(isStreaming) return;

      const prompt = (promptEl.value || "").trim();
      if(!prompt) return;

      addBubble(prompt, "user");
      promptEl.value = "";

      const online = await checkHealth();
      if(!online){
        addBubble(T.offlineMsg.textContent || "SolarAI is offline right now.", "ai");
        return;
      }

      const language = detectLanguage();
      const data_e_hora = nowString();

      const aiBubble = addBubble("", "ai");
      isStreaming = true;
      sendBtn.disabled = true;

      try{
        const res = await fetch(API_BASE + "/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt,
            language,
            data_e_hora,
            stream: true,
            session_id: sessionId,
            max_tokens: 500
          })
        });

        if(!res.ok || !res.body){
          aiBubble.textContent = (T.errorMsg.textContent || "Request failed.") + " (" + res.status + ")";
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        while(true){
          const { value, done } = await reader.read();
          if(done) break;
          if(value){
            aiBubble.textContent += decoder.decode(value, { stream: true });
            chatArea.scrollTop = chatArea.scrollHeight;
          }
        }
      }catch(e){
        aiBubble.textContent = T.errorMsg.textContent || "Request failed.";
      }finally{
        isStreaming = false;
        sendBtn.disabled = false;
      }
    }

    function applyPlaceholder(){
      const ph = T.placeholder.textContent || "Type your message...";
      promptEl.placeholder = ph;
    }

    function newChat(){
      chatArea.innerHTML = "";
      sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
      localStorage.setItem(SESSION_KEY, sessionId);
    }

    // events
    sendBtn.addEventListener("click", send);
    clearBtn.addEventListener("click", () => { chatArea.innerHTML = ""; });
    newChatBtn.addEventListener("click", newChat);

    promptEl.addEventListener("keydown", (e) => {
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        send();
      }
    });

    // init
    setStatus("checking");
    setTimeout(() => {
      applyPlaceholder();
      checkHealth();
    }, 60);
    setInterval(checkHealth, 15000);
  </script>
</body>
</html>
