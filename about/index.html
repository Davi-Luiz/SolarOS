<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="i18n-title" content="page_title_about" />
  <title>SolarOS • About</title>
  <link rel="icon" href="/SolarOS/favicon.ico" />

  <style>
    :root{
      --bg0:#05070d;
      --bg1:#081226;

      --txt:#eef3ff;
      --muted:rgba(238,243,255,.74);
      --muted2:rgba(238,243,255,.55);

      --stroke:rgba(255,255,255,.14);

      --r:22px;
      --shadow: 0 22px 70px rgba(0,0,0,.52);
      --shadow2: 0 10px 35px rgba(0,0,0,.32);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--txt);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
      background:
        radial-gradient(900px 650px at 18% -10%, rgba(77,163,255,.22), transparent 60%),
        radial-gradient(850px 600px at 92% 0%, rgba(255,214,90,.18), transparent 60%),
        radial-gradient(780px 560px at 60% 110%, rgba(160,110,255,.10), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:-2px;
      z-index:-2;
      background: url("/SolarOS/Background.png") center/cover no-repeat;
      filter:saturate(1.05) contrast(1.02);
      opacity:.22;
      transform:scale(1.02);
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;
      background:
        radial-gradient(680px 420px at 18% 18%, rgba(255,255,255,.08), transparent 62%),
        radial-gradient(560px 380px at 78% 26%, rgba(255,255,255,.06), transparent 62%),
        radial-gradient(900px 560px at 50% 86%, rgba(255,255,255,.05), transparent 62%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.010), rgba(255,255,255,.010) 1px, transparent 1px, transparent 3px);
      mix-blend-mode: screen;
      opacity:.85;
    }

    a{ color:inherit; text-decoration:none; }
    a:focus-visible, button:focus-visible{
      outline: 2px solid rgba(77,163,255,.75);
      outline-offset: 3px;
      border-radius: 14px;
    }

    .wrap{
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px;
    }

    /* NAV */
    .nav{
      position: sticky;
      top: 14px;
      z-index: 50;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow2);
      overflow:hidden;
    }
    .nav::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(900px 260px at 15% 0%, rgba(255,214,90,.18), transparent 60%),
        radial-gradient(820px 260px at 85% 10%, rgba(77,163,255,.18), transparent 60%),
        linear-gradient(120deg, rgba(255,255,255,.08), transparent 40%, rgba(255,255,255,.06));
      opacity:.55;
      pointer-events:none;
    }
    .navInner{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding: 10px 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 200px;
    }
    .brandLogo{
      height: 30px;
      width: auto;
      max-width: 220px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.10);
      box-shadow: 0 10px 26px rgba(0,0,0,.30);
      display:block;
      object-fit: contain;
      padding: 4px;
    }

    .links{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .link{
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.10);
      color: var(--muted);
      font-weight: 850;
      font-size: 12px;
      letter-spacing: .2px;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
      display:inline-flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
    }
    .link:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.22);
      background: rgba(255,255,255,.06);
      color: var(--txt);
    }

    button.link{
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      font: inherit;
    }
    button.link.active{
      color: var(--txt);
      border-color: rgba(255,255,255,.22);
      background: rgba(255,255,255,.08);
    }

    .cta{
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 950;
      letter-spacing: .2px;
      font-size: 12px;
      color:#0a1220;
      border: 1px solid rgba(0,0,0,.25);
      background: linear-gradient(180deg, rgba(255,214,90,.98), rgba(255,174,38,.92));
      box-shadow: 0 18px 35px rgba(255,214,90,.18);
      transition: transform .12s ease, filter .12s ease;
      white-space:nowrap;
    }
    .cta:hover{ transform: translateY(-1px); filter: brightness(1.02); }

    /* HERO */
    .hero{
      margin-top: 18px;
      border-radius: var(--r);
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }
    .hero::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(900px 340px at 14% 0%, rgba(77,163,255,.20), transparent 62%),
        radial-gradient(900px 340px at 86% 10%, rgba(255,214,90,.18), transparent 62%),
        linear-gradient(120deg, rgba(255,255,255,.09), transparent 40%, rgba(255,255,255,.06));
      opacity:.50;
      pointer-events:none;
    }
    .heroInner{ position:relative; padding:18px; }

    h1{
      margin: 0 0 8px;
      font-size: 34px;
      letter-spacing: .2px;
      line-height:1.12;
    }
    .lead{
      margin:0;
      color: var(--muted);
      font-size: 14px;
      line-height:1.6;
      max-width: 78ch;
    }

    .notice{
      margin-top: 12px;
      display:inline-flex;
      gap:10px;
      align-items:flex-start;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.16);
      color: var(--muted);
      font-size: 13px;
      line-height:1.45;
      max-width: 82ch;
    }
    .dot{
      width:8px;height:8px;border-radius:999px;
      background: linear-gradient(180deg, rgba(77,163,255,1), rgba(77,163,255,.25));
      box-shadow: 0 0 0 4px rgba(77,163,255,.10);
      margin-top: 4px;
      flex: 0 0 auto;
    }
    .notice strong{ color: var(--txt); font-weight: 950; }

    .grid{
      margin-top: 16px;
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }
    .card{
      grid-column: span 6;
      border-radius: var(--r);
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.05));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow2);
      position:relative;
      overflow:hidden;
      padding: 16px;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background:
        radial-gradient(680px 240px at 20% 0%, rgba(77,163,255,.16), transparent 62%),
        radial-gradient(680px 240px at 85% 10%, rgba(255,214,90,.12), transparent 62%);
      opacity:.35;
      pointer-events:none;
    }
    .card > *{ position:relative; }

    .card h2{
      margin:0 0 8px;
      font-size: 16px;
      letter-spacing:.2px;
    }
    .card p, .card li{
      margin:0;
      color: var(--muted);
      font-size: 13px;
      line-height:1.55;
    }
    .card ul{
      margin: 10px 0 0;
      padding-left: 18px;
    }
    .card li{ margin: 6px 0; }

    .miniRow{
      margin-top: 12px;
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
    }
    .btn{
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color: var(--txt);
      padding: 12px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 950;
      letter-spacing: .2px;
      font-size: 13px;
      box-shadow: 0 10px 26px rgba(0,0,0,.20);
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
      display:inline-flex;
      align-items:center;
      gap:10px;
      white-space:nowrap;
    }
    .btn:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.26);
      background: rgba(255,255,255,.08);
    }
    .btn.primary{
      color:#071223;
      border: 1px solid rgba(0,0,0,.25);
      background: linear-gradient(180deg, rgba(77,163,255,.98), rgba(77,163,255,.74));
      box-shadow: 0 18px 38px rgba(77,163,255,.18);
    }

    .full{ grid-column: span 12; }

    .footer{
      margin: 18px 0 6px;
      text-align:center;
      color: var(--muted2);
      font-size: 12px;
    }

    @media (max-width: 980px){
      .card{ grid-column: span 12; }
      .navInner{ padding: 10px 12px; }
      .brand{ min-width: unset; }
      .brandLogo{ max-width: 160px; }
    }
    @media (max-width: 520px){
      h1{ font-size: 28px; }
      .link{ padding: 9px 10px; }
      .brandLogo{ height: 28px; border-radius: 13px; padding: 4px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- NAV -->
    <header class="nav">
      <div class="navInner">
        <a class="brand" href="/SolarOS/" data-i18n-title="nav_home_title">
          <img class="brandLogo" src="/SolarOS/SolarLogoWithName.png" alt="SolarOS" />
        </a>

        <nav class="links" aria-label="Primary">
          <a class="link" href="/SolarOS/" data-i18n="nav_home"></a>
          <a class="link" href="https://github.com/Davi-Luiz/SolarOS/SolarAI" target="_blank" rel="noreferrer" data-i18n="nav_solar_ai"></a>
          <a class="link" href="/SolarOS/download/" data-i18n="nav_download"></a>
          <a class="link" href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noreferrer" data-i18n="nav_license"></a>
          <a class="link" href="https://discord.gg/3RBkhPtf" target="_blank" rel="noreferrer" data-i18n="nav_community"></a>
          <a class="link" href="https://github.com/Davi-Luiz/SolarOS" target="_blank" rel="noreferrer" data-i18n="nav_source"></a>
          <a class="cta" href="/SolarOS/download/" data-i18n="nav_downloads"></a>
        </nav>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero" style="margin-top:16px;">
      <div class="heroInner">
        <h1 data-i18n="about_hero_title"></h1>
        <p class="lead" data-i18n="about_hero_lead"></p>

        <div class="notice" role="note" aria-label="Status">
          <span class="dot"></span>
          <div>
            <strong data-i18n="about_notice_label"></strong>
            <span data-i18n="about_notice_body"></span>
          </div>
        </div>

        <div class="miniRow" style="margin-top:14px;">
          <a class="btn primary" href="https://discord.gg/3RBkhPtf" target="_blank" rel="noreferrer" data-i18n="about_btn_community"></a>
          <a class="btn" href="https://github.com/Davi-Luiz/SolarOS" target="_blank" rel="noreferrer" data-i18n="about_btn_source"></a>
          <a class="btn" href="/SolarOS/download/" data-i18n="about_btn_downloads"></a>
        </div>
      </div>
    </section>

    <!-- CONTENT -->
    <section class="grid">
      <div class="card full">
        <h2 data-i18n="about_objective_title"></h2>
        <p data-i18n="about_objective_intro"></p>
        <ul>
          <li data-i18n="about_objective_fast"></li>
          <li data-i18n="about_objective_beautiful"></li>
          <li data-i18n="about_objective_easy"></li>
          <li data-i18n="about_objective_configurable"></li>
          <li data-i18n="about_objective_continuous"></li>
        </ul>
        <p style="margin-top:10px;" data-i18n="about_objective_outro"></p>
      </div>

      <div class="card">
        <h2 data-i18n="about_features_title"></h2>
        <ul>
          <li data-i18n="about_features_1"></li>
          <li data-i18n="about_features_2"></li>
          <li data-i18n="about_features_3"></li>
          <li data-i18n="about_features_4"></li>
          <li data-i18n="about_features_5"></li>
          <li data-i18n="about_features_6"></li>
          <li data-i18n="about_features_7"></li>
          <li data-i18n="about_features_8"></li>
        </ul>
      </div>

      <div class="card">
        <h2 data-i18n="about_arch_title"></h2>
        <ul>
          <li>
            <strong data-i18n="about_arch_firmware_label"></strong>
            <span data-i18n="about_arch_firmware_desc"></span>
          </li>
          <li>
            <strong data-i18n="about_arch_kernel_label"></strong>
            <span data-i18n="about_arch_kernel_desc"></span>
          </li>
          <li>
            <strong data-i18n="about_arch_fs_label"></strong>
            <span data-i18n="about_arch_fs_desc"></span>
          </li>
          <li>
            <strong data-i18n="about_arch_ai_label"></strong>
            <span data-i18n="about_arch_ai_desc"></span>
          </li>
        </ul>
      </div>

      <div class="card full">
        <h2 data-i18n="about_devtools_title"></h2>
        <p data-i18n="about_devtools_intro"></p>
        <ul>
          <li data-i18n="about_devtools_1"></li>
          <li data-i18n="about_devtools_2"></li>
          <li data-i18n="about_devtools_3"></li>
        </ul>
        <p style="margin-top:10px;" data-i18n="about_devtools_outro"></p>
      </div>

      <div class="card full">
        <h2 data-i18n="about_status_title"></h2>
        <ul>
          <li data-i18n="about_status_1"></li>
          <li data-i18n="about_status_2"></li>
          <li data-i18n="about_status_3"></li>
          <li data-i18n="about_status_4"></li>
          <li data-i18n="about_status_5"></li>
          <li data-i18n="about_status_6"></li>
          <li data-i18n="about_status_7"></li>
        </ul>
      </div>

      <div class="card full">
        <h2 data-i18n="about_author_title"></h2>
        <p>Davi Luiz</p>
      </div>
    </section>

    <div class="footer" data-i18n="footer"></div>
  </div>

  <script src="/SolarOS/js/i18n.js"></script>
</body>
</html>
