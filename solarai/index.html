<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SolarAI • SolarOS</title>
<link rel="icon" href="/SolarOS/favicon.ico" />

<style>
:root{
  --bg0:#05070d;
  --bg1:#081226;
  --txt:#eef3ff;
  --muted:rgba(238,243,255,.75);
  --glass:rgba(255,255,255,.07);
  --stroke:rgba(255,255,255,.14);
  --accent:#4da3ff;
  --r:22px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
  color:var(--txt);
  background:
    radial-gradient(900px 650px at 18% -10%, rgba(77,163,255,.22), transparent 60%),
    radial-gradient(850px 600px at 92% 0%, rgba(255,214,90,.18), transparent 60%),
    linear-gradient(180deg,var(--bg0),var(--bg1));
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  backdrop-filter:blur(18px);
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.05));
  border-bottom:1px solid var(--stroke);
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img{
  height:28px;
}

.status{
  font-size:13px;
  padding:6px 12px;
  border-radius:999px;
  border:1px solid var(--stroke);
  background:rgba(0,0,0,.2);
}

.status.online{
  color:#9effc8;
  border-color:#3affb6;
}

.status.offline{
  color:#ff9e9e;
  border-color:#ff4d4d;
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  max-width:1000px;
  width:100%;
  margin:0 auto;
  padding:20px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  border-radius:var(--r);
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));
  border:1px solid var(--stroke);
  backdrop-filter:blur(20px);
}

.message{
  margin-bottom:18px;
  line-height:1.5;
}

.message.user{
  text-align:right;
}

.message.ai{
  text-align:left;
  color:var(--muted);
}

.inputBox{
  margin-top:16px;
  display:flex;
  gap:12px;
}

textarea{
  flex:1;
  resize:none;
  height:60px;
  border-radius:16px;
  border:1px solid var(--stroke);
  background:rgba(0,0,0,.25);
  color:var(--txt);
  padding:12px;
  font-size:14px;
}

button{
  padding:0 22px;
  border-radius:16px;
  border:1px solid rgba(0,0,0,.3);
  background:linear-gradient(180deg,#4da3ff,#2f7de6);
  color:#071223;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  filter:brightness(1.05);
}

footer{
  text-align:center;
  font-size:12px;
  color:rgba(255,255,255,.5);
  padding:12px;
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="/SolarOS/SolarLogoWithName.png" alt="SolarOS"/>
    <strong>SolarAI™</strong>
  </div>
  <div id="status" class="status offline">Checking...</div>
</header>

<main>
  <div id="chat" class="chat"></div>

  <div class="inputBox">
    <textarea id="prompt" placeholder="Type your message..."></textarea>
    <button onclick="send()">Send</button>
  </div>
</main>

<footer>
  SolarAI™ • Local AI Engine for SolarOS™
</footer>

<script>
const API_BASE = "http://[2804:56c:c126:4600:be0c:3676:380b:de0f]:8000";

const chat = document.getElementById("chat");
const statusEl = document.getElementById("status");

function addMessage(text, type){
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function checkHealth(){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 2000);

  try{
    const res = await fetch(API_BASE + "/health", {signal:controller.signal});
    clearTimeout(timeout);

    if(res.ok){
      statusEl.textContent = "Online";
      statusEl.classList.remove("offline");
      statusEl.classList.add("online");
      return true;
    }
  }catch(e){}

  statusEl.textContent = "Offline";
  statusEl.classList.remove("online");
  statusEl.classList.add("offline");
  return false;
}

async function send(){
  const textArea = document.getElementById("prompt");
  const prompt = textArea.value.trim();
  if(!prompt) return;

  textArea.value = "";

  addMessage(prompt, "user");

  const aiMessage = addMessage("", "ai");

  const online = await checkHealth();
  if(!online){
    aiMessage.textContent = "SolarAI is currently offline.";
    return;
  }

  const language = document.documentElement.lang || "en";

  const response = await fetch(API_BASE + "/generate", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      prompt: prompt,
      language: language
    })
  });

  const reader = response.body.getReader();
  const decoder = new TextDecoder();

  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    aiMessage.textContent += decoder.decode(value);
    chat.scrollTop = chat.scrollHeight;
  }
}

checkHealth();
setInterval(checkHealth, 15000);
</script>

</body>
</html>
